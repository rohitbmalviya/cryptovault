<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0b0f19" stop-opacity="1" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="1" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Isometric Prism Faces -->
    <linearGradient id="topFace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Core Floating Crystal / Keyhole Glow -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Inner Core Face Gradients -->
    <linearGradient id="coreTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <linearGradient id="coreLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="coreRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Filters for Bloom and Specular Glow -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer Precision Tech Ring with Glowing Accent -->
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.65" />
  
  <!-- Subtle Ambient Core Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.18" filter="url(#hyperGlow)" />

  <!-- 3D Geometric Isometric Vault Crystal Structure -->
  <g filter="url(#softShadow)" transform="translate(256, 252)">
    
    <!-- Outer Vault Hexagonal Shell Faces -->
    <!-- Top Face -->
    <polygon points="0,-150 130,-75 0,0 -130,-75" fill="url(#topFace)" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-130,-75 0,0 0,150 -130,75" fill="url(#leftFace)" />
    <!-- Right Face -->
    <polygon points="130,-75 0,0 0,150 130,75" fill="url(#rightFace)" />

    <!-- Specular Highlight Lines along edges -->
    <polyline points="0,-150 130,-75 0,0 -130,-75 0,-150" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" stroke-linejoin="round" />
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" />
    <polyline points="-130,-75 -130,75 0,150 130,75 130,-75" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.5" stroke-linejoin="round" />

    <!-- Isometric Cutout / Recessed Chamber (The Vault Core) -->
    <!-- Recessed Top Face -->
    <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#090d16" opacity="0.9" />
    <!-- Recessed Left Wall -->
    <polygon points="-60,-35 0,0 0,70 -60,35" fill="#0f172a" opacity="0.9" />
    <!-- Recessed Right Wall -->
    <polygon points="60,-35 0,0 0,70 60,35" fill="#0d1424" opacity="0.9" />

    <!-- Floating Central Hyper-Diamond / Crystalline Node -->
    <g filter="url(#hyperGlow)">
      <!-- Core Floating Top -->
      <polygon points="0,-50 42,-25 0,0 -42,-25" fill="url(#coreTop)" />
      <!-- Core Floating Left -->
      <polygon points="-42,-25 0,0 0,50 -42,25" fill="url(#coreLeft)" />
      <!-- Core Floating Right -->
      <polygon points="42,-25 0,0 0,50 42,25" fill="url(#coreRight)" />

      <!-- Glowing Center Seam -->
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <line x1="-42" y1="-25" x2="42" y2="-25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      
      <!-- Energy Sparkles -->
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>

    <!-- Top & Bottom Cryptographic Node Dots -->
    <circle cx="0" cy="-150" r="5" fill="#38bdf8" />
    <circle cx="130" cy="-75" r="5" fill="#818cf8" />
    <circle cx="-130" cy="-75" r="5" fill="#a855f7" />
    <circle cx="0" cy="150" r="5" fill="#06b6d4" />
    <circle cx="130" cy="75" r="5" fill="#38bdf8" />
    <circle cx="-130" cy="75" r="5" fill="#6366f1" />
  </g>
</svg>
